[package]
name = "canto"
version = "0.0.1"
edition = "2024"
license = "Apache-2.0"
description = "An integration-first local source workspace"
repository = "https://github.com/nijaru/canto"
publish = false

[dependencies]
yrs = "=0.28.0"
rusqlite = { version = "0.38", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
usage-rs = "7"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
